<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: la app usa toda la pantalla, incluso bajo la "muesca" -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RUNA · Saberes vivos de Colombia</title>
  <meta name="description" content="Reserva experiencias auténticas y culturales con anfitriones locales de Colombia." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#DEDBCC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RUNA" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />

  <!-- Tipografías del diseño (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Mapas: Leaflet + OpenStreetMap (gratis, sin clave) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>

  <!-- Estilos: tema → base → componentes → pantallas -->
  <link rel="stylesheet" href="css/tema.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/pantallas.css" />
</head>
<body>
  <div class="telefono" id="app">
    <!-- Barra de estado simulada (solo en computador) -->
    <div class="barra-estado" aria-hidden="true">
      <span>6:06</span>
      <span class="barra-estado__iconos">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4A10.4 10.4 0 0 0 8 .3 10.4 10.4 0 0 0 .7 3.2L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.7c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.7 1.8l1.3 1.4C5.5 6.4 6.7 5.9 8 5.9zm0 3.6c-.5 0-1 .2-1.3.5L8 11.5 9.3 10c-.3-.3-.8-.5-1.3-.5z"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="22" height="11" rx="3"/><rect x="2.5" y="2.5" width="18" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M24.5 4v4" stroke-linecap="round"/></svg>
      </span>
    </div>

    <!-- Encabezado fijo -->
    <header class="encabezado" id="encabezado">
      <div class="encabezado__fila">
        <a href="#/explorar" aria-label="Inicio">
          <img class="encabezado__simbolo" src="assets/img/logo-simbolo.png" alt="" />
        </a>
        <img class="encabezado__texto" src="assets/img/logo-texto.png" alt="RUNA" />
        <a href="#/perfil" class="encabezado__avatar" id="avatar-perfil" aria-label="Mi perfil">
          <img src="assets/img/avatar-usuario.png" alt="" />
        </a>
      </div>
    </header>

    <!-- Aquí el enrutador inserta cada pantalla -->
    <main class="vistas" id="vistas"></main>

    <!-- Botón flotante del mapa -->
    <button class="fab" id="fab-mapa" aria-label="Ver mapa"></button>

    <!-- Barra de navegación inferior -->
    <nav class="nav-inferior" id="nav-inferior" aria-label="Navegación principal"></nav>

    <!-- Aviso emergente -->
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
